services:
  nus-canvas-sync:
    image: ${IMAGE:-ghcr.io/coeeter/nus-canvas-sync:latest}
    environment:
      CANVAS_URL: ${CANVAS_URL:-}
      CANVAS_TOKEN: ${CANVAS_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:-}
      NOTION_DASHBOARD_URL: ${NOTION_DASHBOARD_URL:-}
      NOTION_HEALTH_BLOCK_ID: ${NOTION_HEALTH_BLOCK_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-nasrullah01n@gmail.com}
      TZ: Asia/Singapore
    volumes:
      - nus-sync-data:/data
      - nus-sync-codex:/codex-home
    restart: "no"

volumes:
  nus-sync-data:
  nus-sync-codex:
